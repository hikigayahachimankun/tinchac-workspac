name: T15 independent fixture cold start
on:
  push:
    branches: [task/T15-release-candidate]
    paths: ['backend/app/**', 'frontend/**', 'scripts/**', 'README.md', 'requirements.lock.txt', '.python-version', '.nvmrc', '.github/workflows/t15-cold-start.yml']
permissions:
  contents: read
jobs:
  cold-start:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact public commit without secrets or external actions
        shell: bash
        run: |
          set -euo pipefail
          git init app
          git -C app fetch --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git -C app checkout --detach FETCH_HEAD
          test "$(git -C app rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install pinned tools and system OCR
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-vie tesseract-ocr-eng fonts-dejavu-core
          python3 -m venv /tmp/tinchac-ci-tools
          /tmp/tinchac-ci-tools/bin/pip install uv==0.13.7
          /tmp/tinchac-ci-tools/bin/uv python install 3.11.18
          cd /tmp
          curl --fail --location --output node.tar.xz https://nodejs.org/dist/v22.23.4/node-v22.23.4-linux-x64.tar.xz
          curl --fail --location --output node-sha.txt https://nodejs.org/dist/v22.23.4/SHASUMS256.txt
          node_expected=$(awk '$2 == "node-v22.23.4-linux-x64.tar.xz" {print $1}' node-sha.txt)
          test -n "$node_expected"
          echo "$node_expected  node.tar.xz" | sha256sum --check
          tar -xf node.tar.xz
      - name: Build archive and run README in a new tree and venv
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/tmp/node-v22.23.4-linux-x64/bin:/tmp/tinchac-ci-tools/bin:$PATH"
          cd app
          node --version
          uv venv --python 3.11.18 .venv
          uv pip sync --python .venv/bin/python requirements.lock.txt
          npm ci --prefix frontend
          VITE_API_MODE=http npm run build --prefix frontend
          .venv/bin/python -m scripts.package_release --output /tmp/tinchac-ci-rc.tar.gz
          python3 scripts/cold_start_release.py --archive /tmp/tinchac-ci-rc.tar.gz --output /tmp/tinchac-ci-clean
          tesseract data/fixtures/ocr/vietnamese-clear.png stdout -l vie+eng
          echo "Independent runner: $RUNNER_OS/$RUNNER_ARCH, commit: $GITHUB_SHA"
          cat /tmp/tinchac-ci-clean/result.json
      - name: Retain diagnostics in job logs only
        if: always()
        shell: bash
        run: |
          for report in /tmp/tinchac-ci-clean/commands.json /tmp/tinchac-ci-clean/install.log /tmp/tinchac-ci-clean/server.log; do
            if test -f "$report"; then cat "$report"; fi
          done
  tag-internal-rc:
    needs: cold-start
    if: github.event.repository.private == false && contains(github.event.head_commit.message, '[t15-rc-tag]')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Create annotated RC tag without overwriting any ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          base = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          name = 'v1.0.0-rc.1'
          def call(route, data=None):
              request = urllib.request.Request(base + route, headers=headers,
                  data=None if data is None else json.dumps(data).encode())
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  raise RuntimeError('GitHub tag operation failed, HTTP ' + str(exc.code)) from None
          probe = urllib.request.Request(base + '/git/ref/tags/' + name, headers=headers)
          try:
              with urllib.request.urlopen(probe, timeout=30):
                  raise RuntimeError('RC tag already exists; refusing to overwrite')
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise RuntimeError('Tag preflight failed, HTTP ' + str(exc.code)) from None
          message = ('Internal fixture RC only. Independent Ubuntu cold start passed; API/schema1.0, '
              'fixture-v1, one worker. NOT full T15 or live/research acceptance. Actual DUT supported-case '
              'QA, physical demo laptop and external redistribution rights remain unverified. '
              'Video220s and exact checks are documented; no paid/model call. See reports/release_checklist.md.')
          tag = call('/git/tags', {'tag': name, 'message': message,
              'object': os.environ['GITHUB_SHA'], 'type': 'commit'})
          ref = call('/git/refs', {'ref': 'refs/tags/' + name, 'sha': tag['sha']})
          print(json.dumps({'ref': ref['ref'], 'tag_object': tag['sha'], 'commit': os.environ['GITHUB_SHA']}))
          PY
